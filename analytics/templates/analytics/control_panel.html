{% load static %}
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Analytics Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h3 class="mb-3">Analytics – ETL & Dashboard</h3>

    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-success">{{ m }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" class="mb-4">
      {% csrf_token %}
      <button class="btn btn-primary">
        รัน ETL ตอนนี้
      </button>
      <span class="text-muted ms-2">อ่าน Budget.xlsx + Actual_old.csv + API ➜ คำนวณคงเหลือ</span>
    </form>

    <div class="ratio ratio-16x9 border rounded bg-white shadow-sm">
      <iframe src="{{ superset_url }}" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
