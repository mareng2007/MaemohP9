{% extends "core/base.html" %}
{% load static %}

{% block title %}Budget Analytics (Embedded){% endblock %}

{% block extra-css %}
<style>
  #mount{
    width:100%;
    height:75vh;
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
  }
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h3 class="mb-0">Budget Analytics (Embedded)</h3>
    <a href="{% url 'analytics:control_panel' %}" class="btn btn-outline-secondary">
      <i class="fas fa-arrow-left me-1"></i> กลับไปหน้า Control
    </a>
  </div>
  <div id="mount" class="bg-white shadow-sm"></div>
</div>
{% endblock %}

{% block extra-js %}
<script>
  // โหลด UMD จาก 2 CDN แบบ fallback และถือว่า "สำเร็จ" ก็ต่อเมื่อเจอ global ที่ถูกต้อง
  async function loadSdkUMD() {
    const candidates = [
      // ✅ เรียกที่ root ของแพ็กเกจ (อย่าใส่ /dist/umd/*.js)
      "https://unpkg.com/@superset-ui/embedded-sdk@0.6.0",
      "https://cdn.jsdelivr.net/npm/@superset-ui/embedded-sdk@0.6.0",
    ];

    function inject(url, timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = url;
        s.async = true;
        s.crossOrigin = "anonymous";
        const to = setTimeout(() => {
          s.remove();
          reject(new Error("timeout: " + url));
        }, timeoutMs);
        s.onload = () => { clearTimeout(to); resolve(); };
        s.onerror = () => { clearTimeout(to); s.remove(); reject(new Error("load failed: " + url)); };
        document.head.appendChild(s);
      });
    }

    for (const url of candidates) {
      try {
        await inject(url);
        const sdk = window.supersetEmbeddedSdk || window.SupersetEmbeddedSDK;
        if (sdk && typeof sdk.configure === "function" && typeof sdk.embedDashboard === "function") {
          console.debug("[embedded-sdk] loaded from", url);
          return sdk;
        }
        console.warn("[embedded-sdk] script loaded but global not found from", url);
      } catch (e) {
        console.warn("[embedded-sdk]", e.message);
      }
    }
    throw new Error("Embedded SDK not loaded (UMD)");
  }

  (async () => {
    const mountPoint     = document.getElementById("mount");
    const supersetDomain = "{{ superset_url|escapejs }}";   // เช่น http://localhost:8088
    const dashId         = "{{ dash_id|escapejs }}";        // เช่น 6d6b88e8-81be-4ef3-80ac-2ee4d1d9a6f5

    const fetchGuestToken = () =>
      fetch("{% url 'analytics:superset_token' %}", { credentials: "include" })
        .then(r => { if (!r.ok) throw new Error("Cannot fetch guest token"); return r.json(); })
        .then(d => d.token);

    try {
      const sdk = await loadSdkUMD();      // ✅ มั่นใจว่าได้ตัวจริง
      await sdk.configure({                // ✅ ต้อง configure ก่อนเสมอ
        supersetDomain,
        fetchGuestToken,
        debug: true,
      });

      await sdk.embedDashboard({
        id: dashId,
        mountPoint,
        dashboardUiConfig: {
          hideTitle: false,
          hideChartControls: true,
          filters: { expanded: true },
        },
      });
    } catch (err) {
      console.error(err);
      mountPoint.innerHTML = `<div class="p-4 text-danger">Error: ${err.message || err}</div>`;
    }
  })();
</script>
{% endblock %}
