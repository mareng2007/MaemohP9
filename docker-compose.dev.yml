# version: '3.8'

services:
  db:
    image: postgres:15
    env_file: .env.dev
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks: [nginx-proxy]
  
  db-init:
    image: postgres:15
    container_name: maemohp9-db-init-dev
    env_file: .env.dev
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["/bin/bash","-lc"]
    command: >
      set -e;
      echo "Waiting for Postgres...";
      until pg_isready -h db -U "$POSTGRES_USER" -d postgres; do sleep 1; done;
      echo "Ensuring database superset_meta exists...";
      psql -h db -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='superset_meta'" \
        | grep -q 1 \
        || psql -h db -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE superset_meta OWNER \"$POSTGRES_USER\" ENCODING 'UTF8' TEMPLATE template0;";
      echo "Done.";
    # ⬇️ บรรทัดสำคัญ: กันไม่ให้สร้าง anonymous volume
    volumes:
      - type : tmpfs
        target: /var/lib/postgresql/data
    networks: [nginx-proxy]
    restart: "no"

  redis:
    image: redis:6
    restart: always
    # ป้องกัน anonymous volume จาก VOLUME /data ของ redis image
    volumes:
      - redis_data:/data
    networks: [nginx-proxy]

  web:
    build: .
    container_name: maemohp9-web-dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env.dev
    volumes:
      - .:/app:rw
      - ./static:/app/static
      - data_volume:/app/data    # 👈 เพิ่ม
    ports: ["8000:8000"]
    environment:
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_started }
    restart: always
    networks: [nginx-proxy]

  celery:
    build: .
    container_name: maemohp9-celery-dev
    command: celery -A cashcrm_project worker -l info
    env_file: .env.dev
    volumes:
      - .:/app:rw
      - data_volume:/app/data    # 👈 เพิ่ม
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      redis: { condition: service_started }
      db:    { condition: service_healthy }
    restart: always
    networks: [nginx-proxy]

  celery-beat:
    build: .
    container_name: maemohp9-celery-beat-dev
    command: celery -A cashcrm_project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.dev
    volumes:
      - .:/app:rw
      - data_volume:/app/data    # 👈 เพิ่ม
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_started }
    restart: always
    networks: [nginx-proxy]

  superset:
    build: ./superset
    container_name: superset-dev
    ports: ["8088:8088"]
    env_file: .env.dev
    environment:
      SUPERSET_ENV: development
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      PYTHONPATH: /app/pythonpath
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: ${SUPERSET_DATABASE_URI}
      GUEST_ROLE_NAME: ${GUEST_ROLE_NAME}
      APP_EMBED_HOSTS: ${APP_EMBED_HOSTS}
    command: >
      bash -lc "
        export SQLALCHEMY_DATABASE_URI='postgresql+psycopg2://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/superset_meta';
        echo Using SQLALCHEMY_DATABASE_URI=$SQLALCHEMY_DATABASE_URI;
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "
    volumes:
      - superset_home_dev:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      db:      { condition: service_healthy }
      db-init: { condition: service_completed_successfully }   # 👈 เพิ่มบรรทัดนี้
      redis:   { condition: service_started }
    networks: [nginx-proxy]

  superset-init:
    build: ./superset
    env_file: .env.dev
    environment:
      SUPERSET_ENV: development
      # ให้รองรับทั้ง SUPERSET_DATABASE_URI และ SQLALCHEMY_DATABASE_URI
      # SUPERSET_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/superset_meta
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      PYTHONPATH: /app/pythonpath
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}
      APP_EMBED_HOSTS: ${APP_EMBED_HOSTS}
    volumes:
      - superset_home_dev:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    # สำคัญ: สคริปต์ init อัตโนมัติ
    entrypoint: ["/bin/bash","-lc"]
    command: >
      bash -lc "
        export SQLALCHEMY_DATABASE_URI='postgresql+psycopg2://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/superset_meta';
        echo Using SQLALCHEMY_DATABASE_URI=$SQLALCHEMY_DATABASE_URI;
        superset db upgrade;
        superset fab create-admin \
          --username '$${SUPERSET_ADMIN_USERNAME}' \
          --firstname 'Superset' --lastname 'Admin' \
          --email '$${SUPERSET_ADMIN_EMAIL}' \
          --password '$${SUPERSET_ADMIN_PASSWORD}' || true;
        superset init
      "
    depends_on:
      db:      { condition: service_healthy }
      db-init: { condition: service_completed_successfully }   # 👈 เพิ่มบรรทัดนี้
      redis:   { condition: service_started }
    networks: [nginx-proxy]
    restart: "no"


volumes:
  postgres_data:
    name: maemohp9_postgres_data
  redis_data:
    name: maemohp9_redis_data_dev
  
  data_volume:
    name: maemohp9_data_dev

  superset_home_dev:
    name: maemohp9_superset_home_dev

networks:
  nginx-proxy:
    external: true

